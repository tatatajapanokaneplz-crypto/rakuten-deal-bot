name: Ranking Track (人気ランキングトラック)

on:
  schedule:
    # 日本時間 11:00, 16:00, 23:00 (UTC 2:00, 7:00, 14:00) の1日3回、1回1件のみ投稿。
    # timesaleの投稿時刻(9:00/13:00/20:00 JST)とずらして、投稿がまとまって
    # バーストしないよう間隔を空けている。
    - cron: "0 2,7,14 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run ranking track
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_ALLOWED_SITE: ${{ secrets.RAKUTEN_ALLOWED_SITE }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID_X: ${{ secrets.BUFFER_CHANNEL_ID_X }}
          BUFFER_CHANNEL_ID_THREADS: ${{ secrets.BUFFER_CHANNEL_ID_THREADS }}
          HEALTHCHECK_URL_RANKING: ${{ secrets.HEALTHCHECK_URL_RANKING }}
        run: python -m src.main_ranking