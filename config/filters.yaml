# ランキングトラック専用のフィルタ条件。
# 速報トラック(timesale)には適用しない — 鮮度を優先するため。
#
# ここは「継続的な手動チェック」ではなく「初期構築時に一度だけ設計するルール」という位置づけ。
# 市場状況の変化に応じて、たまに見直す価値はあるが、日常運用では触らない前提。

ranking:
  min_review_count: 10       # レビュー件数がこれ未満の商品は除外(実績のない出品を弾く)
  min_review_score: 3.5      # 評価スコアの下限
  min_days_in_ranking: 1     # ランキング圏内に入ってからの最低経過日数(瞬間的な操作を除外)
                              # ただし速報性を大きく損なわない範囲に留める(過度に高くしない)

  # 景品表示法・薬機法上リスクが高く、機械的なフィルタでは判断しきれないカテゴリは
  # 自動除外する。実際の除外ジャンルコードは楽天カテゴリAPIの値に合わせて追記すること。
  excluded_genre_ids:
    - "healthcare_supplements"   # 例: 健康食品・サプリメント(要 実際のジャンルIDに置換)
    - "medical_devices"          # 例: 医療機器

timesale:
  # 速報トラックは基本的にフィルタなし。ただし、投稿直前チェック(link_checker.py)による
  # 「リンク切れ・販売終了」の検出だけは両トラック共通で必須。
  apply_quality_filter: false

post_composer:
  # 【2026-07 変更】投稿を「本文(煽り)+返信(フック+リンク)」の2段構成に変更したことに伴い、
  # PR表記は本文冒頭ではなく、返信文末尾のハッシュタグにした
  # (景品表示法上、広告と明確に分かる位置にあれば冒頭固定である必要はないため)。
  fixed_pr_label: "#PR"

  # 【2026-07 変更】bot表記は本文からは削除した(エンゲージメント低下を避けるため)。
  # 代わりに、アカウントのプロフィール欄(bio)側で必ず明記する運用とする。
  # このキーはコードからは参照されなくなったが、運用者への申し送り事項として残す。
  bot_disclosure: "※このアカウントは自動投稿botです(本文には書かず、プロフィール欄に明記すること)"